<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:f="jakarta.faces.core"
                template="/WEB-INF/template/main.xhtml">

    <f:metadata>
        <f:viewParam name="id" value="#{musicianView.id}" required="true"/>
        <f:viewAction action="#{musicianView.init()}"/>
    </f:metadata>

    <ui:define name="content">
        <article>
            <header><h2><h:outputText value="#{musicianView.musician.name}"/></h2></header>
            <div class="container">
                <div class="row">
                    <div class="col-4">
                        <div class="row mb-2">
                            <div class="col-6">
                                Level &amp; Genre
                            </div>
                            <div class="col-6">
                                <h:outputText value="#{musicianView.musician.genre}"/>
                                level
                                <h:outputText value="#{musicianView.musician.level}"/>
                            </div>
                        </div>

                        <div class="row mb-2">
                            <div class="col-6">
                                Experience
                            </div>
                            <div class="col-6">
                                <h:outputText value="#{musicianView.musician.experience}"/>
                            </div>
                        </div>

                        <div class="row mb-2">
                            <div class="col-6">
                                Life
                            </div>
                            <div class="col-6">
                                <h:outputText value="#{musicianView.musician.condition}"/>
                            </div>
                        </div>

                        <div class="row mb-2">
                            <div class="col-6">
                                Volume
                            </div>
                            <div class="col-6">
                                <h:outputText value="#{musicianView.musician.volume}"/>
                            </div>
                        </div>

                        <div class="row mb-2">
                            <div class="col-6">
                                Resonance
                            </div>
                            <div class="col-6">
                                <h:outputText value="#{musicianView.musician.resonance}"/>
                            </div>
                        </div>

                        <div class="row mb-2">
                            <div class="col-6">
                                ToneQuality
                            </div>
                            <div class="col-6">
                                <h:outputText value="#{musicianView.musician.toneQuality}"/>
                            </div>
                        </div>

                        <div class="row mb-2">
                            <div class="col-6">
                                Age
                            </div>
                            <div class="col-6">
                                <h:outputText value="#{musicianView.musician.age}"/>
                            </div>
                        </div>

                        <div class="row mb-2">
                            <div class="col-6">
                                Biography
                            </div>
                            <div class="col-6">
                                <h:outputText value="#{musicianView.musician.biography}"/>
                            </div>
                        </div>
                    </div>

                    <div class="col-3">
                        <h:graphicImage alt="Musician portrait" styleClass="w-100"
                                        value="/api/musicians/#{musicianView.id}/portrait"/>
                    </div>
                </div>
            </div>
        </article>
    </ui:define>

</ui:composition>
