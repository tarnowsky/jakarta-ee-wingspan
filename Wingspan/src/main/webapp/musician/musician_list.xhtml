<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:f="jakarta.faces.core"
                template="/WEB-INF/template/main.xhtml">

    <ui:define name="content">
        <article class="text--justified">
            <header><h2>Musicians</h2></header>

            <h:dataTable value="#{musicianList.musicians.musicians}" var="musician"
                         styleClass="table align-middle mb-0 bg-blue" headerClass="bg-light">
                <h:column>
                    <f:facet name="header">Portrait</f:facet>
                    <h:graphicImage styleClass="portrait rounded-circle" alt="Musician portrait"
                                    value="/api/musicians/#{musician.id}/portrait"/>
                </h:column>

                <h:column>
                    <f:facet name="header">Name</f:facet>
                    <h:outputText value="#{musician.name}"/>
                </h:column>

                <h:column>
                    <f:facet name="header">View</f:facet>
                    <h:link outcome="/musician/musician_view.xhtml" value="View">
                        <f:param name="id" value="#{musician.id}"/>
                    </h:link>
                </h:column>

                <h:column>
                    <f:facet name="header">Edit</f:facet>
                    <h:link outcome="/musician/musician_edit.xhtml" value="Edit">
                        <f:param name="id" value="#{musician.id}"/>
                    </h:link>
                </h:column>

                <h:column>
                    <f:facet name="header">Delete</f:facet>
                    <h:form>
                        <h:commandButton styleClass="btn" value="Delete"
                                         action="#{musicianList.deleteAction(musician)}"/>
                    </h:form>
                </h:column>

                <f:facet name="footer">
                    <h:button styleClass="btn" outcome="/musician/musician_create__basic.xhtml"
                              value="Create new musician"/>
                </f:facet>
            </h:dataTable>
        </article>
    </ui:define>

</ui:composition>
